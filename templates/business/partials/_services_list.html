<div id="services-list" class="divide-y divide-black/5">
    {% if services %}
        {% for svc in services %}
            <div id="service-{{ svc.id }}" class="p-4 flex items-center justify-between gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-primary">{{ svc.name }}</span>
                        {% if svc.is_active %}
                            <span class="text-xs bg-success/10 text-success px-2 py-0.5 rounded-full font-bold">فعال</span>
                        {% else %}
                            <span class="text-xs bg-danger/10 text-danger px-2 py-0.5 rounded-full font-bold">غیرفعال</span>
                        {% endif %}
                    </div>
                    <div class="text-xs text-darktext/70 mt-1 flex items-center gap-3 flex-wrap">
                        <span>⏱️ {{ svc.duration }} دقیقه</span>
                        {% if svc.price %}
                            <span class="font-bold">💰 {{ svc.price_display }}</span>
                        {% else %}
                            <span class="text-darktext/40">قیمت تعیین نشده</span>
                        {% endif %}
                    </div>
                </div>

                <div class="flex gap-1 shrink-0">
                    <a href="{% url 'business:edit_service' svc.id %}"
                       class="w-9 h-9 rounded-lg bg-primary/10 text-primary hover:bg-primary hover:text-white transition font-bold flex items-center justify-center"
                       title="ویرایش">
                        ✏️
                    </a>
                    <button type="button"
                            hx-post="{% url 'business:delete_service' svc.id %}"
                            hx-target="#service-{{ svc.id }}"
                            hx-swap="outerHTML swap:0.3s"
                            hx-confirm="مطمئنی می‌خوای «{{ svc.name }}» رو حذف کنی؟"
                            title="حذف"
                            class="w-9 h-9 rounded-lg bg-danger/10 text-danger hover:bg-danger hover:text-white transition font-bold">
                        🗑️
                    </button>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <div class="p-8 text-center text-darktext/50">
            هنوز خدمتی تعریف نکردی.
        </div>
    {% endif %}
</div>
