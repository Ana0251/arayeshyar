<div id="breaks-list" class="divide-y divide-black/5">
    {% if breaks %}
        {% for br in breaks %}
            <div id="break-{{ br.id }}" class="p-4 flex items-center justify-between gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-primary">
                            {{ br.start_time|time:"H:i" }} تا {{ br.end_time|time:"H:i" }}
                        </span>
                        {% if br.is_active %}
                            <span class="text-xs bg-success/10 text-success px-2 py-0.5 rounded-full font-bold">فعال</span>
                        {% else %}
                            <span class="text-xs bg-danger/10 text-danger px-2 py-0.5 rounded-full font-bold">غیرفعال</span>
                        {% endif %}
                    </div>
                    {% if br.label %}
                        <p class="text-sm text-darktext/60 mt-1">📝 {{ br.label }}</p>
                    {% endif %}
                </div>

                <button type="button"
                        hx-post="{% url 'business:delete_break' br.id %}"
                        hx-target="#break-{{ br.id }}"
                        hx-swap="outerHTML swap:0.3s"
                        hx-confirm="مطمئنی می‌خوای حذف کنی؟"
                        class="w-9 h-9 rounded-lg bg-danger/10 text-danger hover:bg-danger hover:text-white transition font-bold shrink-0">
                    🗑️
                </button>
            </div>
        {% endfor %}
    {% else %}
        <div class="p-8 text-center text-darktext/50">
            هنوز وقفه‌ای ثبت نشده.
        </div>
    {% endif %}
</div>
